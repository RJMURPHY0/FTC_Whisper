name: Build and publish Windows installer

# Publishes a signed release from EITHER path:
#   1. Pushing a version tag  (git tag vX.Y.Z && git push origin vX.Y.Z) — always builds.
#   2. Pushing a commit to main that bumps APP_VERSION — auto-builds when no
#      release for that version exists yet. This closes the gap where "push to
#      main" shipped code the auto-updater never saw (it checks GitHub Releases,
#      not commits), so the app kept reporting the old version as "up to date".
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cheap gate (seconds on Linux) so an ordinary main push with no version bump
  # doesn't spin up the heavy Windows build. Outputs the version + a go/no-go.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.VERSION }}
      should_release: ${{ steps.decide.outputs.GO }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'APP_VERSION = \"(.+?)\"', open('app.py').read()).group(1))")
          echo "APP_VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # Explicit tag push or manual dispatch always builds.
          if [[ "${GITHUB_REF}" == refs/tags/* || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Explicit release trigger (${GITHUB_EVENT_NAME} ${GITHUB_REF})."
            echo "GO=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Branch push: build only if this version has no published release yet.
          # Checking the RELEASE (not just the tag) means a previously FAILED
          # build self-heals on the next push instead of being locked out.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already published — nothing to do."
            echo "GO=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for v$VERSION yet — building and publishing."
            echo "GO=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check
    if: ${{ needs.check.outputs.should_release == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # uv installs the heavy wheels (ctranslate2, onnxruntime, numpy…) in
      # parallel and keeps them in a cross-run cache — dependency install drops
      # from minutes to seconds on warm builds.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt pyinstaller

      - name: Prepare build-time config (no secrets)
        shell: pwsh
        run: Copy-Item "config_default.json" "config.json" -Force

      - name: Read APP_VERSION
        id: version
        shell: pwsh
        run: |
          $v = python -c "import re; print(re.search(r'APP_VERSION = \x22(.+?)\x22', open('app.py').read()).group(1))"
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Build executable
        run: pyinstaller --noconfirm --clean "ftc_whisper.spec"

      # ── Code signing via Azure Trusted Signing ────────────────────────────
      # Signs dist\FTC Whisper.exe in place with an Authenticode signature that
      # SmartScreen and Defender trust immediately. Requires the six repo
      # secrets listed in docs/CODE_SIGNING.md. If those secrets are absent
      # (e.g. a fork) the step is skipped so the build still produces an
      # unsigned exe rather than failing.
      - name: Sign executable (Azure Trusted Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        uses: azure/trusted-signing-action@v0.5.9
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Copy preserves the embedded Authenticode signature, so the renamed
      # release asset stays signed.
      - name: Rename release asset
        shell: pwsh
        run: Copy-Item "dist\FTC Whisper.exe" "dist\FTC-Whisper.exe" -Force

      - name: Verify signature
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "dist\FTC-Whisper.exe"
          Write-Host "Signature status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Signature invalid: $($sig.Status)" }

      # ── VirusTotal scan ───────────────────────────────────────────────────
      # Uploads the release exe to VirusTotal and prints the analysis URL so you
      # can see the AV detection rate on every build BEFORE users do. Gated on a
      # free VT_API_KEY repo secret; skipped if absent. Purely informational —
      # never fails the build.
      - name: Scan with VirusTotal
        if: ${{ env.VT_API_KEY != '' }}
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            dist/FTC-Whisper.exe

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: FTC Whisper v${{ steps.version.outputs.VERSION }}
          prerelease: false
          make_latest: true
          files: dist/FTC-Whisper.exe
          overwrite_files: true
          generate_release_notes: true
