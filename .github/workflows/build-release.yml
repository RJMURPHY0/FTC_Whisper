name: Build and publish Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare build-time config (no secrets)
        shell: pwsh
        run: Copy-Item "config_default.json" "config.json" -Force

      - name: Read APP_VERSION
        id: version
        shell: pwsh
        run: |
          $v = python -c "import re; print(re.search(r'APP_VERSION = \x22(.+?)\x22', open('app.py').read()).group(1))"
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Build executable
        run: pyinstaller --noconfirm --clean "ftc_whisper.spec"

      - name: Rename release asset
        shell: pwsh
        run: Copy-Item "dist\FTC Whisper.exe" "dist\FTC-Whisper.exe" -Force

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: FTC Whisper v${{ steps.version.outputs.VERSION }}
          prerelease: false
          make_latest: true
          files: dist/FTC-Whisper.exe
          overwrite_files: true
          generate_release_notes: true
